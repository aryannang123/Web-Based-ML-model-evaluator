<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin - Web-Based ML Model Evaluator</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary"><div class="container-fluid">
    <span class="navbar-brand">Web-Based ML Model Evaluator · Admin</span>
    <div class="d-flex align-items-center gap-3"><span id="current-user" class="text-white"></span><button id="logout-btn" class="btn btn-outline-light btn-sm">Logout</button></div>
</div></nav>
<main class="container my-4">
    <h1 class="h3">Administration</h1>
    <p class="text-muted">Manage account access and dataset records. Activity logs are read-only.</p>
    <div id="admin-feedback" class="alert d-none" role="status"></div>
    <section class="card shadow-sm mb-4">
        <div class="card-header d-flex justify-content-between"><strong>User management</strong><button id="refresh-users" class="btn btn-sm btn-outline-primary">Refresh</button></div>
        <div class="table-responsive"><table class="table table-sm align-middle mb-0"><thead><tr><th>ID</th><th>Username</th><th>Email</th><th>Role</th><th>Active</th><th>Created</th><th></th></tr></thead><tbody id="admin-users-body"></tbody></table></div>
    </section>
    <section class="card shadow-sm mb-4">
        <div class="card-header d-flex justify-content-between"><strong>Dataset records</strong><button id="refresh-datasets" class="btn btn-sm btn-outline-primary">Refresh</button></div>
        <div class="table-responsive"><table class="table table-sm align-middle mb-0"><thead><tr><th>ID</th><th>Owner</th><th>File</th><th>Rows × Columns</th><th>State</th><th></th></tr></thead><tbody id="admin-datasets-body"></tbody></table></div>
    </section>
    <section class="card shadow-sm">
        <div class="card-header d-flex justify-content-between"><strong>System activity logs (read-only)</strong><button id="refresh-logs" class="btn btn-sm btn-outline-primary">Refresh</button></div>
        <div class="table-responsive"><table class="table table-sm mb-0"><thead><tr><th>Time</th><th>Actor</th><th>Event</th><th>Target</th><th>Details</th></tr></thead><tbody id="admin-logs-body"></tbody></table></div>
    </section>
</main>
<script src="/js/app.js"></script>
</body>
</html>
