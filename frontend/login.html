<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Web-Based ML Model Evaluator</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">
    <main class="container my-5">
        <div class="text-center mb-4">
            <h1 class="h3 text-primary">Web-Based ML Model Evaluator</h1>
            <p class="text-muted">Sign in to continue to your dashboard.</p>
        </div>

        <div class="row g-4 justify-content-center">
            <section class="col-md-6 col-lg-5" aria-labelledby="login-heading">
                <div class="card shadow-sm h-100">
                    <div class="card-body p-4">
                        <h2 class="h4" id="login-heading">Sign in</h2>
                        <form id="login-form">
                            <div class="mb-3">
                                <label class="form-label" for="login-username">Username</label>
                                <input class="form-control" id="login-username"
                                       name="username" type="text" maxlength="80"
                                       autocomplete="username" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="login-password">Password</label>
                                <input class="form-control" id="login-password"
                                       name="password" type="password" maxlength="128"
                                       autocomplete="current-password" required>
                            </div>
                            <button class="btn btn-primary w-100" type="submit">
                                Sign in
                            </button>
                        </form>
                        <div id="login-feedback" class="mt-3" role="status"
                             aria-live="polite"></div>
                    </div>
                </div>
            </section>

            <section class="col-md-6 col-lg-5" aria-labelledby="register-heading">
                <div class="card shadow-sm h-100">
                    <div class="card-body p-4">
                        <h2 class="h4" id="register-heading">Create account</h2>
                        <p class="text-muted">New to the evaluator? Register here.</p>
                        <form id="registration-form">
                            <div class="mb-3">
                                <label class="form-label" for="reg-username">Username</label>
                                <input class="form-control" id="reg-username"
                                       name="username" type="text" maxlength="80"
                                       autocomplete="username" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="reg-email">Email</label>
                                <input class="form-control" id="reg-email"
                                       name="email" type="email" maxlength="120"
                                       autocomplete="email" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="reg-password">Password</label>
                                <input class="form-control" id="reg-password"
                                       name="password" type="password" minlength="8" maxlength="128"
                                       autocomplete="new-password" required>
                            </div>
                            <button class="btn btn-outline-primary w-100" type="submit">
                                Register
                            </button>
                        </form>
                        <div id="registration-feedback" class="mt-3" role="status"
                             aria-live="polite"></div>
                    </div>
                </div>
            </section>
        </div>
    </main>
    <script src="/js/app.js"></script>
</body>
</html>
