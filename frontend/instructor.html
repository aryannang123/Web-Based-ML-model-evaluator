<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Instructor review - Web-Based ML Model Evaluator</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary"><div class="container-fluid">
    <span class="navbar-brand">Web-Based ML Model Evaluator · Instructor</span>
    <div class="d-flex align-items-center gap-3"><span id="current-user" class="text-white"></span><button id="logout-btn" class="btn btn-outline-light btn-sm">Logout</button></div>
</div></nav>
<main class="container my-4">
    <h1 class="h3">Shared evaluation results</h1>
    <p class="text-muted">These completed runs were explicitly shared by their owners. Instructor access is read-only.</p>
    <div id="instructor-feedback" class="alert d-none" role="status"></div>
    <section class="card shadow-sm">
        <div class="card-header d-flex justify-content-between"><strong>Available results</strong><button id="refresh-results" class="btn btn-sm btn-outline-primary">Refresh</button></div>
        <div class="table-responsive"><table class="table table-sm align-middle mb-0"><thead><tr><th>Run</th><th>Owner</th><th>Dataset</th><th>Algorithm</th><th>Task / Target</th><th>Metrics</th><th>Review</th></tr></thead><tbody id="instructor-results-body"></tbody></table></div>
    </section>
    <section class="card shadow-sm mt-4"><div class="card-body" id="instructor-detail"><p class="text-muted mb-0">Select a shared result to inspect its metrics and visualization.</p></div></section>
</main>
<script src="/js/app.js"></script>
</body>
</html>
